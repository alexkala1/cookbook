services:
  heirloom:
    build: .
    image: heirloom:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HEIRLOOM_PORT:-3000}:3000"
    environment:
      DATABASE_URL: /app/data/heirloom.db
      HEIRLOOM_PUBLIC_HOST: ${HEIRLOOM_PUBLIC_HOST:-http://localhost:3000}
    volumes:
      # New volumes inherit /app/data ownership from the non-root image.
      - type: volume
        source: heirloom-data
        target: /app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  heirloom-data:
